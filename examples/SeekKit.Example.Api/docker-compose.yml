services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: seekkit-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SeekKit!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SeekKit!Passw0rd' -C -Q 'SELECT 1' -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: examples/SeekKit.Example.Api/Dockerfile
    container_name: seekkit-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=SeekKitDemo;User Id=sa;Password=SeekKit!Passw0rd;TrustServerCertificate=True"
    ports:
      - "8080:8080"

volumes:
  mssql-data:
