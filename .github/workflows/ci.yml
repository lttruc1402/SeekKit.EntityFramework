name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          # .NET 10 SDK can build all TFMs: netstandard2.1, net6, net8, net9, net10
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SeekKit.EntityFramework.slnx

      - name: Build
        run: >
          dotnet build SeekKit.EntityFramework.slnx
          --no-restore
          --configuration Release

      - name: Unit tests
        run: >
          dotnet test SeekKit.EntityFramework.Tests/SeekKit.EntityFramework.Tests.csproj
          --configuration Release --no-build --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage" &&
          dotnet test SeekKit.MongoDB.Tests/SeekKit.MongoDB.Tests.csproj
          --configuration Release --no-build --logger "console;verbosity=normal"

      # Integration tests spin up a real MongoDB via Testcontainers, which needs
      # a Linux Docker daemon — available on the ubuntu runner only.
      - name: Integration tests (real MongoDB)
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test SeekKit.MongoDB.IntegrationTests/SeekKit.MongoDB.IntegrationTests.csproj
          --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Pack (validate packaging)
        run: >
          dotnet pack SeekKit.EntityFramework.slnx
          --no-build
          --configuration Release
          --output ./nupkg
