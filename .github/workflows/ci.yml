name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          # .NET 10 SDK can build all TFMs: netstandard2.1, net6, net8, net9, net10
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SeekKit.EntityFramework.slnx

      - name: Build
        run: >
          dotnet build SeekKit.EntityFramework.slnx
          --no-restore
          --configuration Release

      - name: Test
        run: >
          dotnet test SeekKit.EntityFramework.Tests/SeekKit.EntityFramework.Tests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"

      - name: Pack (validate packaging)
        run: >
          dotnet pack SeekKit.EntityFramework/SeekKit.EntityFramework.csproj
          --no-build
          --configuration Release
          --output ./nupkg
