name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'          # e.g. v1.0.8, v2.0.0-beta.1

jobs:
  publish:
    name: Pack & Push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Release
      id-token: write   # needed for NuGet Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Parse version from tag (strip leading "v") ────────────────────────
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Restore ───────────────────────────────────────────────────────────
      - name: Restore
        run: dotnet restore SeekKit.EntityFramework/SeekKit.EntityFramework.csproj

      # ── Build all TFMs in Release ─────────────────────────────────────────
      - name: Build
        run: >
          dotnet build SeekKit.EntityFramework/SeekKit.EntityFramework.csproj
          --no-restore
          --configuration Release
          -p:Version=${{ steps.version.outputs.VERSION }}

      # ── Pack NuGet package ────────────────────────────────────────────────
      - name: Pack
        run: >
          dotnet pack SeekKit.EntityFramework/SeekKit.EntityFramework.csproj
          --no-build
          --configuration Release
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output ./nupkg

      # ── Push to NuGet.org via Trusted Publishing (OIDC, no stored API key) ──
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: thanhtruc

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ./nupkg/*.nupkg
